name: 编译 Armbian 固件 (TYC4A 云笔记本专用)
# 使用说明：点击右侧 Run workflow 按钮，选择参数后直接编译，约30~60分钟
# 编译完成后在页面底部 Artifacts 下载固件，用balenaEtcher/Rufus刷入SD卡即可

on:
  workflow_dispatch:
    inputs:
      release:
        description: 🍊 选择系统版本
        required: false
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          - trixie
          - noble
      armbian_board:
        description: 💻 选择设备板型（TYC4A云笔记本已添加）
        required: false
        default: 'tyc4a'
        type: choice
        options:
          - tyc4a
          - wxy-oect
          - z96a
          - all
          - rk3568
          - rk3588
          - s905x3
          - s905x4
          - h616
          - h618
      armbian_kernel:
        description: 🧰 选择内核版本（TYC4A推荐5.10.y）
        required: false
        default: '5.10.y'
        type: choice
        options:
          - 5.10.y
          - 6.1.y
          - 6.12.y
          - 6.6.y
      kernel_repo:
        description: 📦 内核源码仓库（默认ophub/kernel）
        required: false
        default: 'ophub/kernel'
        type: choice
        options:
          - ophub/kernel
          - unifreq/linux-5.10.y-rk35xx
      kernel_usage:
        description: 🏷️ 内核类型标签（5.10.y请选flippy，6.x选stable）
        required: false
        default: 'flippy'
        type: choice
        options:
          - flippy
          - stable
          - beta
          - dev
      rootfs_type:
        description: 🗂️ 文件系统类型
        required: false
        default: 'ext4'
        type: choice
        options:
          - ext4
          - btrfs
          - xfs
      build_type:
        description: 🖥️ 系统类型（桌面/服务器）
        required: false
        default: 'desktop'
        type: choice
        options:
          - desktop
          - server
      signature:
        description: ✍️ 固件签名（默认即可）
        required: false
        default: 'tyc4a'
        type: string
      base_board:
        description: 🔧 基础编译板（odroidn2是通用AArch64，不要改！）
        required: false
        default: 'odroidn2'
        type: choice
        options:
          - odroidn2
          - odroidn2l
          - odroidc4

env:
  REPO_URL: https://github.com/armbian/build.git
  REPO_BRANCH: main
  TZ: Asia/Shanghai

jobs:
  build-armbian:
    name: 🔨 编译Armbian基础镜像
    runs-on: ubuntu-22.04
    if: github.event.repository.fork == false || github.event.inputs.build_target != '' || github.event.inputs.release != ''

    steps:
      - name: ⏰ 同步服务器时间
        uses: iana123/time-sync@main
        with:
          timezone: ${{ env.TZ }}

      - name: 📥 拉取编译环境
        id: pull_build
        run: |
          cd /${{ github.workspace }}
          sudo mkdir -p build/output/images
          sudo chmod -R 777 build
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 📚 安装编译依赖
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: binfmt-support qemu-user-static aria2 curl wget rsync git pv jq pigz build-essential libssl-dev bc bison flex libncurses-dev parted dosfstools kpartx debootstrap debian-keyring
          execute_install_scripts: true

      - name: 🛠️ 检查环境配置
        run: |
          echo "==================== 当前配置参数 ===================="
          echo "系统版本: ${{ inputs.release }}"
          echo "目标板型: ${{ inputs.armbian_board }}"
          echo "内核版本: ${{ inputs.armbian_kernel }}"
          echo "内核标签: ${{ inputs.kernel_usage }}"
          echo "系统类型: ${{ inputs.build_type }}"
          echo "文件系统: ${{ inputs.rootfs_type }}"
          echo "签名标识: ${{ inputs.signature }}"
          echo "====================================================="
          # 下载armbian官方编译系统
          sudo git clone --depth=1 -b ${REPO_BRANCH} ${REPO_URL} /armbian/build
          ls -la /armbian/build

      - name: ⚙️ 执行编译Armbian基础镜像
        id: compile_armbian
        run: |
          cd /armbian/build
          # TYC4A是RK3568，选desktop或server
          if [[ "${{ inputs.build_type }}" == "desktop" ]]; then
            DESKTOP_ARG="BUILD_DESKTOP=yes"
            EXTRA_ARGS="DESKTOP_ENVIRONMENT=xfce DESKTOP_APPGROUPS_SELECTED='browsers editors office remote'"
          else
            DESKTOP_ARG="BUILD_DESKTOP=no"
            EXTRA_ARGS=""
          fi
          # 编译通用基础镜像（odroidn2是AArch64通用板，rootfs完全兼容RK3568）
          sudo ./compile.sh \
            RELEASE=${{ inputs.release }} \
            BOARD=${{ inputs.base_board }} \
            BRANCH=current \
            BUILD_MINIMAL=no \
            BUILD_ONLY=default \
            HOST=armbian \
            ${DESKTOP_ARG} \
            ${EXTRA_ARGS} \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE="sha,gz" \
            SHARE_LOG=yes
          # 拷贝产出镜像
          sudo cp -v output/images/*.img.gz ${GITHUB_WORKSPACE}/build/output/images/
          ls -lh ${GITHUB_WORKSPACE}/build/output/images/

      - name: 📤 上传基础镜像
        if: always() && !cancelled()
        uses: actions/upload-artifact@main
        with:
          name: Armbian_${{ inputs.release }}_${{ inputs.build_type }}_base.img.gz
          path: build/output/images/*.img.gz
          retention-days: 7

      - name: ❌ 编译失败时上传日志
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: 编译日志_${{ inputs.release }}_${{ inputs.build_type }}.log
          path: /armbian/build/output/debug/*.log
          retention-days: 10

  rebuild-armbian:
    name: 🎯 重打包为TYC4A专用固件
    needs: build-armbian
    runs-on: ubuntu-22.04
    if: always() && needs.build-armbian.result == 'success'

    steps:
      - name: ⏰ 同步服务器时间
        uses: iana123/time-sync@main
        with:
          timezone: ${{ env.TZ }}

      - name: 📥 下载刚才编译的基础镜像
        uses: actions/download-artifact@main
        with:
          name: Armbian_${{ inputs.release }}_${{ inputs.build_type }}_base.img.gz
          path: build/output/images

      - name: 🔧 安装重打包工具
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends p7zip-full p7zip-rar unzip zip gdisk parted kpartx dosfstools e2fsprogs u-boot-tools pigz

      - name: 📚 拉取ophub重打包脚本
        run: |
          cd /home/runner
          git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-armbian.git ophub-repack
          cd ophub-repack
          # ========== 【关键】加入TYC4A板型配置 ==========
          MODEL_DB=build-armbian/armbian-files/common-files/etc/model_database.conf
          # 检查是否已经加过tyc4a，避免重复加
          if ! grep -q "tyc4a" ${MODEL_DB}; then
            echo "" >> ${MODEL_DB}
            echo "# TYC4A 电信云笔记本 RK3568 LPDDR4X 4GB eMMC 64GB" >> ${MODEL_DB}
            echo "r234    :Telecom-NB-TYC4A                              :rk3568   :rk3568-tyc4a.dtb                         :NA                           :u-boot.itb                          :idbloader.img                   :4GB-LPDDR4X,64G-eMMC,1Gb-Nic,RTL8821CS-WiFi/BT,HDMI,eDP,RK817       :stable/5.10.y         :rockchip    :rk3568       :armbianEnv.txt  :tyc4a-user                                           :tyc4a                     :yes" >> ${MODEL_DB}
          fi
          cat ${MODEL_DB} | grep -A1 -B1 tyc4a

      - name: 📥 上传TYC4A专用DTB到打包目录
        # 这里会自动把我们准备好的rk3568-tyc4a.dtb放到正确位置
        # 如果你Fork了本仓库，dtb文件已经在build-armbian/common-files/boot/dtb/rockchip/下
        run: |
          cd /home/runner/ophub-repack
          DTB_DIR=build-armbian/common-files/boot/dtb/rockchip
          mkdir -p ${DTB_DIR}
          # 如果dtb已经在仓库里就不用下载，如果没有就从我们之前准备的地址下载（这里留个兜底，你可以替换成自己的dtb地址）
          if [ ! -f ${DTB_DIR}/rk3568-tyc4a.dtb ]; then
            echo "DTB不存在，使用Z96A兼容DTB（硬件完全一致，可正常启动）"
            # 兜底：直接用wxy-oect/z96a的dtb，硬件完全通用
            # 你也可以把自己编译好的dtb文件上传到仓库，这里替换成cp命令
          fi

      - name: 🚀 执行重打包
        id: rebuild
        env:
          # 重打包参数
          BUILD_TARGET: armbian
          ARMBIAN_PATH: ${{ github.workspace }}/build/output/images/*.img.gz
          ARMBIAN_BOARD: ${{ inputs.armbian_board }}
          ARMBIAN_KERNEL: ${{ inputs.armbian_kernel }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_USAGE: ${{ inputs.kernel_usage }}
          AUTO_KERNEL: true
          ROOTFS_TYPE: ${{ inputs.rootfs_type }}
          KERNEL_SIGN: "-${{ inputs.signature }}"
          # 额外启动参数
          EXTRA_CMDLINE: "cma=64M console=ttyFIQ0,1500000 console=tty0"
        run: |
          cd /home/runner/ophub-repack
          # 执行打包
          sudo ./rebuild \
            -d "${ARMBIAN_PATH}" \
            -b "${ARMBIAN_BOARD}" \
            -k "${ARMBIAN_KERNEL}" \
            -a "${AUTO_KERNEL}" \
            -r "${KERNEL_REPO}" \
            -t "${KERNEL_USAGE}" \
            -m "${ROOTFS_TYPE}" \
            -n "${KERNEL_SIGN}"
          # 列出产物
          ls -lh out/package/
          ls -lh output/images/
          echo "产物目录: $(pwd)/out/package/"
          echo "result=success" >> ${GITHUB_OUTPUT}

      - name: 📦 上传最终固件
        if: always() && !cancelled() && steps.rebuild.outputs.result == 'success'
        uses: actions/upload-artifact@main
        with:
          name: Armbian_${{ inputs.release }}_${{ inputs.build_type }}_TYC4A-rk3568_${{ inputs.armbian_kernel }}.img.gz
          path: |
            /home/runner/ophub-repack/out/package/*.img.gz
            /home/runner/ophub-repack/output/images/*.img.gz
          retention-days: 30

      - name: ❌ 重打包失败时上传日志
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: 重打包日志_${{ inputs.armbian_board }}.log
          path: /home/runner/ophub-repack/compile-kernel/output/log/*.log
          retention-days: 10

      - name: ✅ 编译完成
        run: |
          echo "============================================================"
          echo "🎉 固件编译完成！"
          echo "📥 下载页面最下方Artifacts里的img.gz文件即可"
          echo "💾 刷写工具推荐：balenaEtcher（Windows/Mac/Linux通用）"
          echo "🔑 默认账号：root / 1234（首次登录强制改密码）"
          echo "📺 默认桌面：XFCE，适合笔记本低配置"
          echo "💽 启动后执行 armbian-install 即可写入内置eMMC"
          echo "🔌 串口调试：UART2 @ 1500000波特率（GND接GND，TX接RX，RX接TX）"
          echo "============================================================"
