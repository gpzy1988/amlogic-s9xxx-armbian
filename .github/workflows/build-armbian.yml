name: Build Armbian

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      release:
        description: Set the OS Version
        required: true
        default: noble
        type: choice
        options:
          - noble
          - jammy
          - bookworm
          - bullseye
      armbian_board:
        description: Set the Box Board
        required: true
        default: tyc4a
        type: choice
        options:
          - tyc4a
          - wxy-oect
          - all
          - r66s
          - r68s
          - h616
          - h618
          - h68k
          - h68k-two
          - h69k
          - h88k
          - h88k-v2
          - h88k-v3
          - h88k-v5
          - hk1
          - e900v22c
          - phicomm-n1
      armbian_kernel:
        description: Select the kernel version
        required: false
        default: 5.10.y
        type: choice
        options:
          - 5.10.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
      kernel_repo:
        description: Set the kernel repository
        required: false
        default: ophub/kernel
        type: string
      kernel_usage:
        description: Set the tags of the stable kernel
        required: false
        default: flippy
        type: choice
        options:
          - stable
          - flippy
          - dev
          - beta
      rootfs_type:
        description: Select armbian rootfs type
        required: false
        default: ext4
        type: choice
        options:
          - btrfs
          - ext4
      build_type:
        description: Select image edition type
        required: false
        default: desktop
        type: choice
        options:
          - server
          - desktop
      builder_sign:
        description: Set Armbian builder signature
        required: false
        default: tyc4a

jobs:
  rebuild:
    runs-on: ubuntu-latest
    name: Rebuild Armbian for target boards
    steps:
      - uses: actions/checkout@main

      - name: Download official Armbian base image
        run: |
          mkdir -p build/output/images/
          cd build/output/images/
          echo "Downloading Armbian wxy-oect base image (hardware compatible with TYC4A)..."
          wget -q --show-progress "https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_24.11_wxy-oect_jammy_6.1.75_server_20250123/Armbian_24.11_wxy-oect_jammy_6.1.75_server_20250123.img.gz" -O base.img.gz || \
          wget -q --show-progress "https://github.com/ophub/amlogic-s9xxx-armbian/releases/latest/download/Armbian_*_wxy-oect_*_server.img.gz" -O base.img.gz
          gunzip base.img.gz
          ls -lh
          echo "Base image ready"

      - name: Rebuild Armbian for TYC4A
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img
          armbian_board: ${{ inputs.armbian_board }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          auto_kernel: true
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          armbian_fstype: ${{ inputs.rootfs_type }}
          builder_name: ${{ inputs.builder_sign }}
          make_bootscripts: yes

      - name: Upload firmware artifact
        uses: actions/upload-artifact@main
        with:
          name: Armbian_${{ inputs.armbian_board }}_${{ inputs.armbian_kernel }}
          path: build/output/images/*
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: tyc4a_${{ inputs.armbian_kernel }}_${{ github.run_number }}
          name: TYC4A Armbian ${{ inputs.armbian_kernel }} Firmware
          body: |
            ## TYC4A 天翼云笔记本 Armbian Firmware
            - OS: ${{ inputs.release }}
            - Kernel: ${{ inputs.armbian_kernel }}
            - Type: ${{ inputs.build_type }}
            - Default login: root / 1234
            - Serial: UART2 1500000 baud
            - Flash: RKDevTool eMMC / balenaEtcher SD card
          files: build/output/images/*
