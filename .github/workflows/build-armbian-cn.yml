# =========================================================================
# 🔨 Armbian 固件编译（中文版）- 支持天翼云 TYC4A RK3568 云笔记本
# 基于 ophub/amlogic-s9xxx-armbian 官方修改
# =========================================================================

name: 🔨 TYC4A Armbian固件一键编译

on:
  workflow_dispatch:
    inputs:
      release:
        description: 系统版本
        required: true
        default: noble
        type: choice
        options:
          - noble
          - jammy
          - bookworm
      armbian_kernel:
        description: 内核版本
        required: true
        default: 5.10.y
        type: choice
        options:
          - 5.10.y
          - 6.1.y
          - 6.6.y
      kernel_usage:
        description: 内核源
        required: false
        default: flippy
        type: choice
        options:
          - flippy
          - stable
      build_type:
        description: 版本类型
        required: false
        default: desktop
        type: choice
        options:
          - desktop
          - server

jobs:
  build:
    name: 🚀 一键编译TYC4A固件
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 检出仓库
        uses: actions/checkout@main

      - name: ⚙️ 注册TYC4A设备
        run: |
          echo 'r234    :Telecom-NB-TYC4A                              :rk3568   :rk3568-tyc4a.dtb                         :NA                           :u-boot.itb                          :idbloader.img                   :4GB-LPDDR4X,64G-eMMC,1Gb-Nic,WiFi,BT       :stable/5.10.y         :rockchip    :rk3568       :armbianEnv.txt  :tyc4a-user                                           :tyc4a                     :yes' >> build-armbian/armbian-files/common-files/etc/model_database.conf

      - name: 📦 设置启动参数
        run: |
          mkdir -p build-armbian/common-files/etc/
          echo "extraargs=cma=64M console=ttyFIQ0,1500000 console=tty1" > build-armbian/common-files/etc/armbianEnv.txt.append
          echo "hostname=tyc4a" >> build-armbian/common-files/etc/armbianEnv.txt.append

      - name: 🔨 ophub自动组装固件（自动下载rootfs+内核+uboot）
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_board: tyc4a
          armbian_kernel: ${{ inputs.armbian_kernel }}
          version_branch: ${{ inputs.release }}
          kernel_usage: ${{ inputs.kernel_usage }}
          auto_kernel: true
          rootfs_type: ext4
          builder_sign: tyc4a

      - name: 📤 上传固件
        uses: actions/upload-artifact@main
        with:
          name: TYC4A-Armbian-Firmware
          path: out/**/*.img.gz
          retention-days: 30

      - name: 🚀 发布到Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: tyc4a_${{ inputs.armbian_kernel }}_${{ github.run_number }}
          name: TYC4A Armbian ${{ inputs.armbian_kernel }} 固件 Build ${{ github.run_number }}
          body: |
            ## TYC4A Armbian固件
            - 系统: ${{ inputs.release }}
            - 内核: ${{ inputs.armbian_kernel }}
            - 类型: ${{ inputs.build_type }}
            - 默认账号: root / 1234
            - 串口: 1500000波特率
            - 刷写: RKDevTool线刷/SD卡写入
          files: out/**/*.img.gz
