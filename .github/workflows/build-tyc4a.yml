name: Build TYC4A Armbian (5.10 kernel)

on:
  workflow_dispatch:
    inputs:
      release:
        description: Debian/Ubuntu release
        default: bookworm
        type: choice
        options:
          - bookworm
          - jammy
      desktop:
        description: Desktop environment (server=no desktop)
        default: xfce
        type: choice
        options:
          - xfce
          - gnome
          - server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Armbian for Z96a (TYC4A compatible)
        id: build
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_board: z96a
          armbian_kernel: 5.10.y
          armbian_release: ${{ github.event.inputs.release }}
          armbian_make_command: ${{ github.event.inputs.desktop == 'server' && 'build_armbian_sd' || format('build_armbian_sd_{0}', github.event.inputs.desktop) }}
          auto_kernel: true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_${{ github.event.inputs.release }}_${{ github.event.inputs.desktop }}_TYC4A-rk3568_5.10.img.gz
          path: ${{ steps.build.outputs.armbian_firmware_path }}
          retention-days: 30
