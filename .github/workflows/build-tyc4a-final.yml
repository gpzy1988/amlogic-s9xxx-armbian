name: 🔨 编译 Armbian 固件 (中文版) - 支持TYC4A云笔记本

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      release:
        description: 选择系统版本
        required: true
        default: noble
        type: choice
        options:
          - noble
          - jammy
          - bookworm
          - bullseye
      armbian_board:
        description: 选择设备板型
        required: true
        default: tyc4a
        type: choice
        options:
          - tyc4a
          - wxy-oect
          - z96a
          - all
          - r66s
          - r68s
          - h616
      armbian_kernel:
        description: 选择内核版本 (5.10.y RK3568驱动最稳)
        required: true
        default: 5.10.y
        type: choice
        options:
          - 5.10.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
      kernel_repo:
        description: 内核仓库
        required: false
        default: ophub/kernel
        type: string
      kernel_usage:
        description: 内核标签 (5.10选flippy，6.x选stable)
        required: false
        default: flippy
        type: choice
        options:
          - flippy
          - stable
          - beta
          - dev
      rootfs_type:
        description: 文件系统类型
        required: false
        default: ext4
        type: choice
        options:
          - ext4
          - btrfs
      build_type:
        description: 系统类型 (desktop=带桌面，server=纯命令行)
        required: false
        default: desktop
        type: choice
        options:
          - desktop
          - server
      builder_sign:
        description: 固件签名标识
        required: false
        default: tyc4a
        type: string
      base_board:
        description: 基础编译板型 (不用改)
        required: false
        default: odroidn2
        type: string

jobs:
  编译Armbian基础镜像:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 检出代码
        uses: actions/checkout@main

      - name: 📦 安装必要依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex bc libssl-dev libncurses-dev python3 python3-pyelftools

      - name: ⚙️ 注册TYC4A设备到设备库
        run: |
          # 在model_database.conf末尾加入TYC4A配置
          cat >> build-armbian/armbian-files/common-files/etc/model_database.conf << 'EOF'
          r234    :Telecom-NB-TYC4A                              :rk3568   :rk3568-tyc4a.dtb                         :NA                           :u-boot.itb                          :idbloader.img                   :4GB-LPDDR4X,64G-eMMC,1Gb-Nic,WiFi,BT       :stable/5.10.y         :rockchip    :rk3568       :armbianEnv.txt  :tyc4a-user                                           :tyc4a                     :yes
          EOF

      - name: 📥 检出Armbian官方编译系统
        run: |
          git clone --depth=1 https://github.com/armbian/build.git compile-armbian
          cd compile-armbian

      - name: 🔨 编译基础通用镜像 (非交互模式)
        run: |
          cd compile-armbian
          NONINTERACTIVE=yes \
          ./compile.sh \
            RELEASE=${{ inputs.release }} \
            BOARD=${{ inputs.base_board }} \
            BRANCH=current \
            BUILD_MINIMAL=no \
            BUILD_ONLY=default \
            BUILD_DESKTOP=no \
            HOST=armbian \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,gz \
            EXPERT=yes \
            SHARE_LOG=yes

      - name: 📤 上传基础镜像产物
        uses: actions/upload-artifact@main
        with:
          name: base-armbian-img
          path: compile-armbian/output/images/*.img.gz
          retention-days: 7

  重打包为TYC4A专用固件:
    runs-on: ubuntu-latest
    needs: 编译Armbian基础镜像
    steps:
      - name: 🔄 检出代码
        uses: actions/checkout@main

      - name: 📥 下载基础镜像
        uses: actions/download-artifact@main
        with:
          name: base-armbian-img
          path: build/output/images/

      - name: ⚙️ 注册TYC4A设备到设备库
        run: |
          cat >> build-armbian/armbian-files/common-files/etc/model_database.conf << 'EOF'
          r234    :Telecom-NB-TYC4A                              :rk3568   :rk3568-tyc4a.dtb                         :NA                           :u-boot.itb                          :idbloader.img                   :4GB-LPDDR4X,64G-eMMC,1Gb-Nic,WiFi,BT       :stable/5.10.y         :rockchip    :rk3568       :armbianEnv.txt  :tyc4a-user                                           :tyc4a                     :yes
          EOF

      - name: 📦 注入TYC4A默认启动参数
        run: |
          mkdir -p build-armbian/common-files/etc/
          echo "extraargs=cma=64M console=ttyFIQ0,1500000 console=tty1" > build-armbian/common-files/etc/armbianEnv.txt.append
          echo "hostname=tyc4a" >> build-armbian/common-files/etc/armbianEnv.txt.append

      - name: 🔧 重打包为板型专用固件
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ inputs.armbian_board }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          auto_kernel: true
          rootfs_type: ${{ inputs.rootfs_type }}
          builder_sign: ${{ inputs.builder_sign }}

      - name: 📤 上传最终固件
        uses: actions/upload-artifact@main
        with:
          name: TYC4A-Armbian-Firmware
          path: build/output/images/*.img.gz
          retention-days: 30

      - name: 🚀 发布固件到Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: tyc4a_5.10_${{ github.run_number }}
          name: TYC4A Armbian 5.10 固件 Build ${{ github.run_number }}
          body: |
            ## 📋 TYC4A 云笔记本 Armbian 固件
            - 系统: ${{ inputs.release }} (Ubuntu/Debian)
            - 内核: ${{ inputs.armbian_kernel }} (flippy维护)
            - 类型: ${{ inputs.build_type }}
            - 默认账号: root / 1234
            - 串口: UART2 1500000波特率
            - 刷机方法: RKDevTool线刷/balenaEtcher写SD卡
            - 启动后执行 `armbian-install` 写入内置eMMC
          files: build/output/images/*.img.gz
